<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Firepot Arcade</title>
<meta name="theme-color" content="#0B0A10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --void:#0B0A10; --chili:#FF5A1F; --ember:#FFB03A; --dough:#F7E9CE;
    --scallion:#7FD46A;
    --display:"Haettenschweiler","Arial Narrow Bold","Impact","Oswald",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--void)}
  body{
    min-height:100dvh;background:var(--void);font-family:var(--mono);color:var(--dough);
    display:flex;justify-content:center;-webkit-font-smoothing:antialiased;
  }
  #wrap{width:100%;max-width:480px;padding:38px 22px 46px;position:relative}

  /* the broth glow, same signature as the games */
  #wrap::before{
    content:'';position:fixed;left:0;right:0;bottom:0;height:38vh;pointer-events:none;
    background:radial-gradient(120% 100% at 50% 130%,rgba(255,90,31,.30) 0%,rgba(255,90,31,0) 62%);
  }
  header{position:relative;text-align:center;margin-bottom:34px}
  .eyebrow{font-size:9px;letter-spacing:.36em;text-transform:uppercase;color:var(--chili)}
  h1{
    font-family:var(--display);font-weight:400;font-size:clamp(46px,15vw,70px);
    line-height:.84;text-transform:uppercase;margin-top:12px;
    text-shadow:0 0 46px rgba(255,90,31,.5);
  }
  h1 em{font-style:normal;display:block;color:var(--chili)}
  .tagline{font-size:11px;letter-spacing:.14em;color:rgba(247,233,206,.45);margin-top:16px;line-height:1.9}
  .rule{width:44px;height:2px;background:var(--chili);margin:22px auto 0;box-shadow:0 0 14px rgba(255,90,31,.9)}

  .grid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .card{
    display:flex;flex-direction:column;gap:9px;padding:16px 14px 13px;
    background:rgba(247,233,206,.045);border:1px solid rgba(247,233,206,.09);
    border-radius:3px;text-decoration:none;color:inherit;position:relative;overflow:hidden;
    transition:border-color .18s,background .18s,transform .12s;
  }
  .card.live{border-color:rgba(255,176,58,.32);background:rgba(255,176,58,.05)}
  .card.live:active{transform:scale(.982)}
  .card.live::after{
    content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--ember);
    box-shadow:0 0 14px var(--ember);
  }
  .card.soon{opacity:.42}
  .glyph{width:34px;height:34px;color:var(--ember)}
  .card.soon .glyph{color:rgba(247,233,206,.5)}
  .name{font-family:var(--display);font-size:20px;line-height:1;text-transform:uppercase}
  .desc{font-size:10px;line-height:1.65;color:rgba(247,233,206,.5);min-height:32px}
  .foot{
    display:flex;align-items:baseline;justify-content:space-between;gap:6px;
    margin-top:2px;padding-top:9px;border-top:1px solid rgba(247,233,206,.08);
    font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  }
  .foot .lbl{color:rgba(247,233,206,.32)}
  .foot .val{color:var(--ember);font-variant-numeric:tabular-nums;letter-spacing:.06em}
  .card.soon .foot .val{color:rgba(247,233,206,.35)}

  footer{position:relative;text-align:center;margin-top:34px;
    font-size:9px;letter-spacing:.2em;color:rgba(247,233,206,.26);line-height:2.4}
  #staff{background:none;border:0;color:inherit;font:inherit;letter-spacing:.2em;cursor:pointer;padding:4px}

  @media (max-width:340px){.grid{grid-template-columns:1fr}}
  @media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div class="eyebrow" id="logo">Firepot Seafood &amp; Hotpot</div>
    <h1>Firepot<em>Arcade</em></h1>
    <div class="tagline">Pick something to do<br>while the broth comes up.</div>
    <div class="rule"></div>
  </header>

  <div class="grid" id="grid"></div>

  <footer>
    Scores reset nightly · new course every morning<br>
    <button id="staff">Firepot Arcade · Stafford</button>
  </footer>
</div>

<script>
(function(){
'use strict';
/* =========================================================================
   FIREPOT ARCADE — hub
   Point every table QR at this page, not at an individual game. Adding a
   game then means editing GAMES below and dropping a folder in the repo —
   no new subdomain, no new DNS record, and no reprinting table tents.
   ========================================================================= */
const CONFIG={
  API_URL:'',              // same Apps Script /exec URL the games use
  API_KEY:'firepot-2026'
};

/* id must match the GAME value inside that game's own CONFIG block */
const GAMES=[
  {id:'dumpling', path:'dumpling/', name:'Dumpling Dash',  desc:'Escape the chopsticks. One thumb.',        glyph:'dumpling', live:true},
  {id:'broth',    path:'broth/',    name:'Broth Sort',     desc:'Swipe mala left, mild right. Fast.',       glyph:'broth'},
  {id:'boil',     path:'boil/',     name:'Perfect Boil',   desc:'Pull the meat at the exact right second.', glyph:'boil'},
  {id:'ladle',    path:'ladle/',    name:'Ladle Frenzy',   desc:'Fifteen seconds. Scoop everything good.',  glyph:'ladle'},
  {id:'sauce',    path:'sauce/',    name:'Sauce Lab',      desc:'Repeat the recipe. It gets longer.',       glyph:'sauce'},
  {id:'meatball', path:'meatball/', name:'Meatball Toss',  desc:'Flick it. Arc it. Land it in the pot.',    glyph:'meatball'},
  {id:'enoki',    path:'enoki/',    name:'Enoki Hunt',     desc:'Spot the odd one. Grid keeps growing.',    glyph:'enoki'},
  {id:'iq',       path:'iq/',       name:'Hotpot IQ',      desc:'Rapid trivia. Half of it is our menu.',    glyph:'iq'}
];

const G={
 dumpling:'<path d="M4 22c0-6 4-10 8-10s8 4 8 10c0 2-3 3-8 3s-8-1-8-3z"/><path d="M8 13V9M12 12V8M16 13V9"/>',
 broth:'<path d="M3 12h7M7 9l-4 3 4 3"/><path d="M21 12h-7M17 9l4 3-4 3"/><circle cx="12" cy="6" r="1.6"/><circle cx="12" cy="18" r="1.6"/>',
 boil:'<rect x="3" y="9" width="18" height="6" rx="2"/><path d="M14 7v10"/>',
 ladle:'<path d="M14 4v9a5 5 0 0 1-10 0"/><path d="M14 4h6"/>',
 sauce:'<circle cx="7" cy="8" r="2.4"/><circle cx="16" cy="7" r="2.4"/><circle cx="11" cy="16" r="2.4"/><circle cx="19" cy="15" r="2.4"/>',
 meatball:'<path d="M3 20c3-11 9-14 15-14"/><circle cx="18" cy="17" r="4"/>',
 enoki:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1" stroke-dasharray="2 2"/>',
 iq:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.6 2.6 0 1 1 3.4 2.5c-.6.2-.9.7-.9 1.4v.4"/><circle cx="12" cy="17" r=".9" fill="currentColor" stroke="none"/>'
};
function svg(k){
  return '<svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
    'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+(G[k]||'')+'</svg>';
}

document.getElementById('grid').innerHTML=GAMES.map(g=>{
  const live=!!g.live;
  return '<'+(live?'a href="'+g.path+'"':'div')+' class="card '+(live?'live':'soon')+'">'
    + svg(g.glyph)
    + '<div class="name">'+g.name+'</div>'
    + '<div class="desc">'+g.desc+'</div>'
    + '<div class="foot"><span class="lbl">'+(live?'Tonight':'Status')+'</span>'
    +   '<span class="val" data-top="'+g.id+'">'+(live?'—':'Soon')+'</span></div>'
    + '</'+(live?'a':'div')+'>';
}).join('');

/* Tonight's leader per game. Purely decorative — if the backend isn't wired
   up yet, or the wifi is down, the cards just keep showing a dash. */
function jsonp(params){
  return new Promise((res,rej)=>{
    if(!CONFIG.API_URL)return rej('no api');
    const cb='fp_'+Math.random().toString(36).slice(2,9);
    const s=document.createElement('script');
    const to=setTimeout(()=>{clean();rej('timeout');},8000);
    function clean(){clearTimeout(to);try{delete window[cb];}catch(e){}s.remove();}
    window[cb]=d=>{clean();res(d);};
    const q=Object.keys(params).map(k=>k+'='+encodeURIComponent(params[k])).join('&');
    s.src=CONFIG.API_URL+'?'+q+'&k='+encodeURIComponent(CONFIG.API_KEY)+'&callback='+cb;
    s.onerror=()=>{clean();rej('unreachable');};
    document.head.appendChild(s);
  });
}
function courseKey(){const d=new Date();
  return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
(async function(){
  try{
    const d=await jsonp({a:'games',course:courseKey()});
    if(!d||!d.ok)return;
    (d.rows||[]).forEach(r=>{
      const el=document.querySelector('[data-top="'+r.game+'"]');
      if(el&&r.s)el.textContent=r.i+' '+r.s;
    });
  }catch(e){/* stay quiet; the dash is a fine resting state */}
})();

/* Staff access lives inside each game's own panel. This is just a shortcut
   into whichever game you're standing in front of. */
let taps=0,t0=0;
document.getElementById('staff').addEventListener('click',()=>{
  const now=Date.now();if(now-t0>1200)taps=0;t0=now;taps++;
  if(taps>=5){taps=0;location.href='dumpling/';}
});
})();
</script>
</body>
</html>
